<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark from components/brand/logo.tsx, flattened for a favicon: no CSS
       variables, no currentColor, no gradients — a tab icon is parsed outside any
       document context.

       A plate rather than a bare glyph, because the tab bar may be white or
       black: the tile supplies its own contrast, so the Q is legible on either. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g transform="translate(16 16) scale(0.88) translate(-16 -16)">
    <circle cx="13.55" cy="13.55" r="10.1" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="25.9" cy="25.9" r="3.9" fill="#ffffff"/>
  </g>
</svg>
