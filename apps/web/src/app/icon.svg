<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark from components/brand/logo.tsx, flattened for a favicon: no CSS
       variables and no gradients that need a document context. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcff"/>
      <stop offset="100%" stop-color="#e6e2f5"/>
    </linearGradient>
    <linearGradient id="pageShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdfcff"/>
      <stop offset="100%" stop-color="#dcd6ee"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#plate)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <path d="M9 10.6h3.4v8.2L10.7 17l-1.7 1.8z" fill="#f0c04a"/>
