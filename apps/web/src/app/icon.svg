  <path d="M25.4 10.2 16.9 12v12.1l8.5-1.8z" fill="url(#pageShade)"/>
  <rect x="15.1" y="11.7" width="1.8" height="12.6" fill="#5b4a80"/>

  <path d="M19.6 17.2l1.9 2 3.6-4.3" fill="none" stroke="#7c3aed" stroke-width="2.1" stroke-linecap="square"/>
